name: 构建玩客云uboot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装依赖 + gcc7 armhf交叉编译器（PPA源，无外部大文件下载）
        run: |
          sudo apt update
          # 添加gcc工具链ppa源
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt update
          # 安装gcc7/g++7 armhf交叉编译套件
          sudo apt install -y make imagemagick build-essential bc device-tree-compiler python3 bison flex
          sudo apt install -y gcc-7-arm-linux-gnueabihf g++-7-arm-linux-gnueabihf
          # 创建软链接，简化CROSS_COMPILE
          ln -sf /usr/bin/arm-linux-gnueabihf-gcc-7 $HOME/.local/bin/arm-linux-gnueabihf-gcc
          ln -sf /usr/bin/arm-linux-gnueabihf-g++-7 $HOME/.local/bin/arm-linux-gnueabihf-g++
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 编译U-Boot
        run: |
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make distclean
          make m8b_onecloud_config
          make -j$(nproc)

      - name: 下载 AmlImg
        run: |
          ver="v0.3.2"
          curl --retry 3 -L -o ./AmlImg https://github.com/hhyj2002/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64
          chmod +x ./AmlImg

      - name: 生成资源图片
        run: |
          mkdir -p resource
          convert \
            -size 640x360 \
            -background black \
            -gravity center -font "DejaVu-Sans" -pointsize 64 -fill white label:"U-Boot" \
            BMP3:resource/bootup.bmp

          cat <<EOF >resource/list.txt
          090000:bootup:bootup.bmp
          EOF
          ./AmlImg res_pack build/resource.img resource/

      - name: 生成 eMMC 直刷底包
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pack
          cp build/ddr_init.bin pack/DDR.USB
          cp build/u-boot-comp.bin pack/UBOOT_COMP.USB

          cat <<EOF >pack/aml_sdc_burn.ini
          [common]
          erase_bootloader    = 1
          erase_flash         = 0
          reboot              = 0
          [burn_ex]
          package     = aml_upgrade_package.img
          EOF

          cat <<EOF >pack/platform.conf
          Platform:0x0801
          BinPara:0xd9010000
          DDRLoad:0xd9000000
          DDRRun:0xd9000030
          Uboot_down:0x200000
          Uboot_decomp:0xd9000030
          EOF

          cp build/u-boot.bin pack/bootloader.img
          echo -n "sha1sum $(sha1sum build/u-boot.bin | awk '{print $1}')" >pack/bootloader.VERIFY
          cp build/resource.img pack/resource.img
          echo -n "sha1sum $(sha1sum build/resource.img | awk '{print $1}')" >pack/resource.VERIFY

          cat <<EOF >pack/commands.txt
          USB:DDR:normal:DDR.USB
          USB:UBOOT_COMP:normal:UBOOT_COMP.USB
          ini:aml_sdc_burn:normal:aml_sdc_burn.ini
          conf:platform:normal:platform.conf
          PARTITION:bootloader:normal:bootloader.img
          VERIFY:bootloader:normal:bootloader.VERIFY
          PARTITION:resource:normal:resource.img
          VERIFY:resource:normal:resource.VERIFY
          EOF
          ./AmlImg pack build/eMMC.burn.img pack/

          export OWRT_DATE=$(TZ=Asia/Shanghai date +"%y.%m.%d_%H.%M.%S")
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV

      - name: 整理固件
        run: |
          mkdir -p outfile
          cp build/*.bin ./outfile
          cp build/resource.img ./outfile
          cp build/eMMC.burn.img ./outfile

      - name: 上传EMMC直刷底包
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: Onecloud_Uboot_${{ env.OWRT_DATE }}
          body: |
            自用玩客云直刷底包eMMC.burn.img！刷写底包将抹去所有信息！
            =============基本信息============
            源码：https://github.com/hzyitc/u-boot-onecloud
            平台：linux/armv7
          artifacts: outfile/*
