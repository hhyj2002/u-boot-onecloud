name: 构建玩客云uboot[rmoyulong修改]

on:
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检查项目
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y make imagemagick bc build-essential flex bison python3 device-tree-compiler xz-utils

      - name: 下载 gcc‑linaro‑arm‑none‑eabi‑4.8‑2014.04（阿里云镜像）
        run: |
          FILE_NAME="gcc-linaro-arm-none-eabi-4.8-2014.04_linux.tar.xz"
          curl --retry 10 --retry-delay 5 --connect-timeout 20 -L -o ${FILE_NAME} https://mirrors.aliyun.com/armbian-releases/_toolchain/gcc-linaro-arm-none-eabi-4.8-2014.04_linux.tar.xz
          tar -xf ./${FILE_NAME}

      - name: 编译U‑Boot
        run: |
          TOOLCHAIN_DIR=$(pwd)/gcc-linaro-arm-none-eabi-4.8-2014.04_linux/bin
          export PATH="${TOOLCHAIN_DIR}:$PATH"
          export CROSS_COMPILE=arm-none-eabi-
          arm-none-eabi-gcc --version
          make distclean
          make m8b_onecloud_config
          make -j$(nproc)

      - name: 下载 AmlImg
        run: |
          ver="v0.3.2"
          curl --retry 3 -L -o ./AmlImg https://github.com/rmoyulong/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64
          chmod +x ./AmlImg

      - name: 生成资源图片resource.img
        run: |
          mkdir -p resource

          convert \
            -size 640x360 \
            -background black \
            -gravity center -font "DejaVu-Sans" -pointsize 64 -fill white label:"U-Boot" \
            BMP3:resource/bootup.bmp

          cat <<EOF >resource/list.txt
          090000:bootup:bootup.bmp
          EOF
          ./AmlImg res_pack build/resource.img resource/

      - name: 生成 eMMC 直刷底包
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pack

          cp build/ddr_init.bin pack/DDR.USB
          cp build/u-boot-comp.bin pack/UBOOT_COMP.USB

          cat <<EOF >pack/aml_sdc_burn.ini
          [common]
          erase_bootloader    = 1
          erase_flash         = 0
          reboot              = 0

          ;package will filled by sdacard burning tool
          [burn_ex]
          package     = aml_upgrade_package.img
          ;media       =
          EOF

          cat <<EOF >pack/platform.conf
          Platform:0x0801
          BinPara:0xd9010000
          DDRLoad:0xd9000000
          DDRRun:0xd9000030
          Uboot_down:0x200000
          Uboot_decomp:0xd9000030
          EOF

          cp build/u-boot.bin pack/bootloader.img
          SHA1_UBOOT=$(sha1sum build/u-boot.bin | awk '{print $1}')
          echo -n "${SHA1_UBOOT}" >pack/bootloader.VERIFY

          cp build/resource.img pack/resource.img
          SHA1_RES=$(sha1sum build/resource.img | awk '{print $1}')
          echo -n "${SHA1_RES}" >pack/resource.VERIFY

          cat <<EOF >pack/commands.txt
          USB:DDR:normal:DDR.USB
          USB:UBOOT_COMP:normal:UBOOT_COMP.USB

          ini:aml_sdc_burn:normal:aml_sdc_burn.ini
          conf:platform:normal:platform.conf

          PARTITION:bootloader:normal:bootloader.img
          VERIFY:bootloader:normal:bootloader.VERIFY

          PARTITION:resource:normal:resource.img
          VERIFY:resource:normal:resource.VERIFY

          # PARTITION:boot:normal:boot.img
          # VERIFY:boot:normal:boot.VERIFY
          # PARTITION:rootfs:normal:rootfs.img
          # VERIFY:rootfs:normal:rootfs.VERIFY
          EOF

          ./AmlImg pack build/eMMC.burn.img pack/

          OWRT_DATE=$(TZ=Asia/Shanghai date +"%y.%m.%d_%H.%M.%S")
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV

      - name: 整理固件输出文件
        run: |
          mkdir -p outfile
          cp build/*.bin ./outfile
          cp build/resource.img ./outfile
          cp build/eMMC.burn.img ./outfile

      - name: 上传EMMC直刷底包到Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: Onecloud_Uboot_${{ env.OWRT_DATE }}
          body: |
            自用玩客云直刷底包eMMC.burn.img！刷写底包将抹去所有信息！
            =============基本信息============
            源码：https://github.com/hzyitc/u-boot-onecloud
            编译工具链：gcc‑linaro‑arm‑none‑eabi‑4.8‑2014.04（阿里云镜像）
            平台：Amlogic S805 玩客云
          artifacts: outfile/*
