name: 构建玩客云uboot

on:
  #自动编译：每天早上4点
  #schedule:
    #- cron: 0 20 * * *
  #手动编译
  workflow_dispatch:

#CI权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检查项目
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y make imagemagick build-essential bc device-tree-compiler python3 bison flex

      - name: 缓存Linaro工具链
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            gcc-linaro-7.5.0-2019.12-x86_64-arm-none-eabi
            gcc-linaro-7.5.0-2019.12-x86_64-arm-none-eabi.tar.xz
          key: ${{ runner.os }}-linaro7.5-2019.12

      - name: 下载依赖
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          curl --retry 5 -L -O https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-none-eabi/gcc-linaro-7.5.0-2019.12-x86_64-arm-none-eabi.tar.xz
          FILESIZE=$(stat -c%s gcc-linaro-7.5.0-2019.12-x86_64-arm-none-eabi.tar.xz)
          if [ $FILESIZE -lt 10000000 ];then echo "文件下载异常，文件过小！";exit 1;fi
          tar xvf gcc-linaro-7.5.0-2019.12-x86_64-arm-none-eabi.tar.xz
          echo "TOOLCHAIN_DIR=gcc-linaro-7.5.0-2019.12-x86_64-arm-none-eabi" >> $GITHUB_ENV

      - name: 加载工具链目录名（缓存命中时用）
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        run: |
          echo "TOOLCHAIN_DIR=gcc-linaro-7.5.0-2019.12-x86_64-arm-none-eabi" >> $GITHUB_ENV

      - name: 编译
        run: |
          export PATH="$PATH:${PWD}/${{ env.TOOLCHAIN_DIR }}/bin"
          cd u-boot-onecloud
          make distclean
          make m8b_onecloud_config
          make -j$(nproc)

      - name: 下载 AmlImg
        run: |
          ver="v0.3.2"
          curl --retry 3 -L -o ./AmlImg https://github.com/hhyj2002/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64
          chmod +x ./AmlImg

      - name: 生成资源
        run: |
          mkdir -p resource

          convert \
            -size 640x360 \
            -background black \
            -gravity center -font "DejaVu-Sans" -pointsize 64 -fill white label:"U-Boot" \
            BMP3:resource/bootup.bmp

          cat <<EOF >resource/list.txt
          090000:bootup:bootup.bmp
          EOF
          ./AmlImg res_pack u-boot-onecloud/build/resource.img resource/

      - name: 生成 eMMC 直刷底包
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pack
          cd u-boot-onecloud
          cp build/ddr_init.bin ../pack/DDR.USB
          cp build/u-boot-comp.bin ../pack/UBOOT_COMP.USB

          cat <<EOF >../pack/aml_sdc_burn.ini
          [common]
          erase_bootloader    = 1
          erase_flash         = 0
          reboot              = 0

          ;package will filled by sdacard burning tool
          [burn_ex]
          package     = aml_upgrade_package.img
          ;media       =
          EOF

          cat <<EOF >../pack/platform.conf
          Platform:0x0801
          BinPara:0xd9010000
          DDRLoad:0xd9000000
          DDRRun:0xd9000030
          Uboot_down:0x200000
          Uboot_decomp:0xd9000030
          EOF

          cp build/u-boot.bin ../pack/bootloader.img
          echo -n "sha1sum $(sha1sum build/u-boot.bin | awk '{print $1}')" >../pack/bootloader.VERIFY

          cp build/resource.img ../pack/resource.img
          echo -n "sha1sum $(sha1sum build/resource.img | awk '{print $1}')" >../pack/resource.VERIFY

          cat <<EOF >../pack/commands.txt
          USB:DDR:normal:DDR.USB
          USB:UBOOT_COMP:normal:UBOOT_COMP.USB

          ini:aml_sdc_burn:normal:aml_sdc_burn.ini
          conf:platform:normal:platform.conf

          PARTITION:bootloader:normal:bootloader.img
          VERIFY:bootloader:normal:bootloader.VERIFY

          PARTITION:resource:normal:resource.img
          VERIFY:resource:normal:resource.VERIFY
          EOF
          cd ..
          ./AmlImg pack u-boot-onecloud/build/eMMC.burn.img pack/
          
          export OWRT_DATE=$(TZ=Asia/Shanghai date +"%y.%m.%d_%H.%M.%S")
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
          
      - name: 整理固件
        run: |
          mkdir -p outfile
          cp u-boot-onecloud/build/*.bin ./outfile
          cp u-boot-onecloud/build/resource.img ./outfile
          cp u-boot-onecloud/build/eMMC.burn.img ./outfile

      - name: 上传EMMC直刷底包
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: Onecloud_Uboot_${{ env.OWRT_DATE }}
          body: |
            自用玩客云直刷底包eMMC.burn.img！刷写底包将抹去所有信息！
            =============基本信息============

            源码：https://github.com/hzyitc/u-boot-onecloud
            平台：linux/armv7
          artifacts: outfile/*
